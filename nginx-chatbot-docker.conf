# Upstream for WhatsApp bot
upstream chatbot_backend {
    server 172.17.0.1:3000;
}

# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name chatbot.productosdelagua.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name chatbot.productosdelagua.com;

    ssl_certificate /etc/letsencrypt/live/chatbot.productosdelagua.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot.productosdelagua.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/chatbot_access.log;
    error_log /var/log/nginx/chatbot_error.log;

    location / {
        proxy_pass http://chatbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
